name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/api/global.json

      - name: Restore .NET dependencies
        run: dotnet restore OrionSearch.sln

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build OrionSearch.sln --configuration Release --no-restore

      - name: Run automated and PostgreSQL integration tests
        run: >-
          dotnet test OrionSearch.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=orionsearch-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: services/api/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
