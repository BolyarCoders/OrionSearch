name: Research worker tests

on:
  pull_request:
    paths:
      - "services/research-worker/**"
      - ".github/workflows/research-worker-tests.yml"
  push:
    branches:
      - main
      - feature/ai-worker
    paths:
      - "services/research-worker/**"
      - ".github/workflows/research-worker-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/research-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest fastapi pydantic python-dotenv requests feedparser httpx
      - name: Run worker and collector tests
        run: python -m pytest tests agent/tests -q
