services:
  - type: web
    name: orionsearch-api
    runtime: docker
    repo: https://github.com/BolyarCoders/OrionSearch
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: ResearchWorker__Enabled
        value: "false"
      - key: ReverseProxy__TrustRenderEdge
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: orionsearch-postgres
          property: connectionString

databases:
  - name: orionsearch-postgres
    databaseName: orionsearch
    user: orionsearch
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
